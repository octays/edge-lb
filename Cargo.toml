[workspace]
members = [
    "edge-lb",
    "edge-lb-common",
    "edge-lb-ebpf",
    "tools/ha-bench",
    "tools/backend-server",
]
resolver = "2"
exclude = ["ui"]

[workspace.package]
version = "0.1.9"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
aya = "0.14"
aya-ebpf = "0.1"
aya-ebpf-cty = "0.2"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
edge-lb-common = { path = "edge-lb-common" }
libc = "0.2"
base64 = "0.22"
hmac = "0.12"
hex = "0.4"
network-types = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rtnetlink = "0.17"
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
regex = "1"
prost = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
stunclient = "0.4.2"
wren-bfd = "0.3.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-stream = "0.1"
toml = "0.9"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
